name: Upstream auto-merge

# 3pino fork: merge the upstream-sync PR once CI passes, then publish a fork
# release. CI for the sync branch runs on the push, not on the pull request,
# because pull requests opened with GITHUB_TOKEN do not trigger workflows, so
# both event kinds are accepted here. Merging and dispatching use GITHUB_TOKEN:
# the PAT does not need pull requests write, only contents write for the push.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'upstream-sync'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the sync pull request
        id: merge
        run: |
          number=$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open upstream-sync pull request"
            exit 0
          fi

          head=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          if [ "$head" != "$RUN_HEAD_SHA" ]; then
            echo "PR #$number head moved to $head; waiting for the CI run of that commit"
            exit 0
          fi

          gh pr merge "$number" --merge --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # workflow_dispatch still starts a run when it comes from GITHUB_TOKEN.
      - name: Trigger the fork release
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run fork-release.yml --ref main
